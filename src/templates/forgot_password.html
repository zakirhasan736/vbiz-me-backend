<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset your password — VBizMe</title>
    <style type="text/css">
      body {
        margin: 0;
        padding: 0;
        width: 100% !important;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f4f6f8;
      }
      table {
        border-collapse: collapse !important;
      }
      a[x-apple-data-detectors] {
        color: inherit !important;
        text-decoration: none !important;
      }
      @media screen and (max-width: 600px) {
        .wrapper {
          width: 100% !important;
        }
        .mobile-padding {
          padding-left: 16px !important;
          padding-right: 16px !important;
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f6f8">
    <table border="0" cellpadding="0" cellspacing="0" width="100%">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="600"
            class="wrapper"
            style="max-width: 600px; background-color: #ffffff; border-radius: 8px; overflow: hidden"
          >
            <tr>
              <td align="center" style="background-color: #0f766e; padding: 28px 24px" class="mobile-padding">
                <p style="margin: 0; color: #ffffff; font-size: 22px; font-weight: 700; letter-spacing: 0.5px">
                  VBizMe
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 36px 28px 12px" class="mobile-padding">
                <h1 style="margin: 0 0 12px; color: #111827; font-size: 24px; font-weight: 700">Reset your password</h1>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 8px 28px 28px" class="mobile-padding">
                <p style="margin: 0; color: #4b5563; font-size: 16px; line-height: 1.6">
                  We received a request to reset your password. Click the button below to choose a new password.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 0 28px 36px" class="mobile-padding">
                <a
                  href="{{url}}"
                  style="
                    display: inline-block;
                    background-color: #0f766e;
                    color: #ffffff;
                    text-decoration: none;
                    font-size: 16px;
                    font-weight: 600;
                    padding: 14px 32px;
                    border-radius: 6px;
                  "
                  >Reset password</a
                >
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 0 28px 28px" class="mobile-padding">
                <p style="margin: 0; color: #9ca3af; font-size: 13px; line-height: 1.5">
                  If you did not request a password reset, you can safely ignore this email.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="background-color: #f9fafb; padding: 20px 28px" class="mobile-padding">
                <p style="margin: 0; color: #6b7280; font-size: 12px">© {{year}} VBizMe. All rights reserved.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
