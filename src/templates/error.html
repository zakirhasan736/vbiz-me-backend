<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Something went wrong — VBizMe</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f6f8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #1a1a1a;
      }
      .container {
        text-align: center;
        max-width: 420px;
        width: 90%;
        background: #ffffff;
        padding: 40px 28px;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      }
      .brand {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: #0f766e;
        margin-bottom: 20px;
      }
      .icon {
        color: #e11d48;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 12px;
        color: #111827;
      }
      p {
        font-size: 15px;
        color: #4b5563;
        line-height: 1.6;
        margin: 0 0 28px;
      }
      .button {
        display: inline-block;
        background-color: #111827;
        color: #ffffff;
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 6px;
      }
      .button:hover {
        background-color: #374151;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="brand">VBizMe</div>
      <div class="icon">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="64"
          height="64"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
      </div>
      <h1>Something went wrong</h1>
      <p>We could not complete your request. Please try again, or return to the site and continue from there.</p>
      <a href="{{link}}" class="button">Back to site</a>
    </div>
  </body>
</html>
