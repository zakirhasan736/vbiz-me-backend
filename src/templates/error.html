<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Something went wrong — vBiz Me</title>
    <style>
      body {
        font-family: Inter, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f5f5f4;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #0b1020;
      }
      .container {
        text-align: center;
        max-width: 420px;
        width: 90%;
        background: #ffffff;
        padding: 40px 28px;
        border-radius: 8px;
        border: 1px solid #e7e5e4;
      }
      .logo {
        display: block;
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
      }
      .accent {
        width: 48px;
        height: 2px;
        background-color: #d4af37;
        margin: 0 auto 24px;
      }
      .icon {
        color: #e11d48;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 12px;
        color: #0b1020;
      }
      p {
        font-size: 15px;
        color: #737373;
        line-height: 1.6;
        margin: 0 0 28px;
      }
      .button {
        display: inline-block;
        background-color: #0b1020;
        color: #ffffff;
        text-decoration: none;
        font-size: 15px;
        font-weight: 700;
        padding: 12px 24px;
        border-radius: 6px;
      }
      .button:hover {
        background-color: #1c2333;
      }
      .footer {
        margin-top: 28px;
        font-size: 12px;
        color: #a3a3a3;
      }
      .footer a {
        color: #737373;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img class="logo" src="https://www.vbizme.com/logo-vbizme.webp" alt="vBiz Me" width="56" height="56" />
      <div class="accent"></div>
      <div class="icon">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="48"
          height="48"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
      </div>
      <h1>Something went wrong</h1>
      <p>We could not complete your request. Please try again, or return to the site and continue from there.</p>
      <a href="{{link}}" class="button">Back to site</a>
      <div class="footer">
        <a href="https://www.vbizme.com/privacy-policy">Privacy</a>
        ·
        <a href="https://www.vbizme.com/terms-and-conditions">Terms</a>
      </div>
    </div>
  </body>
</html>
