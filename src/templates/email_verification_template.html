<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm your email — vBiz Me</title>
    <style type="text/css">
      body {
        margin: 0;
        padding: 0;
        width: 100% !important;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
        font-family: Inter, Helvetica, Arial, sans-serif;
        background-color: #f5f5f4;
      }
      table {
        border-collapse: collapse !important;
      }
      a[x-apple-data-detectors] {
        color: inherit !important;
        text-decoration: none !important;
      }
      @media screen and (max-width: 600px) {
        .wrapper {
          width: 100% !important;
        }
        .mobile-padding {
          padding-left: 20px !important;
          padding-right: 20px !important;
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f5f5f4">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" role="presentation">
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="600"
            class="wrapper"
            role="presentation"
            style="max-width: 600px; background-color: #ffffff; border-radius: 8px; overflow: hidden"
          >
            <tr>
              <td align="center" style="padding: 32px 32px 20px" class="mobile-padding">
                <img
                  src="cid:vbiz-logo"
                  alt="vBiz Me"
                  width="56"
                  height="56"
                  style="display: block; width: 56px; height: 56px; border: 0; outline: none"
                />
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 0 32px 28px" class="mobile-padding">
                <table border="0" cellpadding="0" cellspacing="0" width="48" role="presentation">
                  <tr>
                    <td style="height: 2px; background-color: #d4af37; font-size: 0; line-height: 0">&nbsp;</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 0 32px 12px" class="mobile-padding">
                <h1
                  style="
                    margin: 0;
                    color: #0b1020;
                    font-size: 22px;
                    font-weight: 700;
                    line-height: 1.3;
                    font-family: Inter, Helvetica, Arial, sans-serif;
                  "
                >
                  Confirm your email
                </h1>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 0 32px 8px" class="mobile-padding">
                <p
                  style="
                    margin: 0;
                    color: #737373;
                    font-size: 15px;
                    line-height: 1.6;
                    font-family: Inter, Helvetica, Arial, sans-serif;
                  "
                >
                  Hi {{user_name}},
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 0 32px 28px" class="mobile-padding">
                <p
                  style="
                    margin: 0;
                    color: #737373;
                    font-size: 15px;
                    line-height: 1.6;
                    font-family: Inter, Helvetica, Arial, sans-serif;
                  "
                >
                  Use the verification code below to verify your email and finish setting up your account.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 0 32px 28px" class="mobile-padding">
                <p
                  style="
                    margin: 0;
                    display: inline-block;
                    background-color: #fafaf9;
                    border: 1px solid #e7e5e4;
                    color: #0b1020;
                    font-size: 28px;
                    font-weight: 700;
                    letter-spacing: 8px;
                    padding: 16px 24px;
                    border-radius: 6px;
                    font-family: Inter, Helvetica, Arial, sans-serif;
                  "
                >
                  {{OTP}}
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 0 32px 32px" class="mobile-padding">
                <p
                  style="
                    margin: 0;
                    color: #a3a3a3;
                    font-size: 13px;
                    line-height: 1.5;
                    font-family: Inter, Helvetica, Arial, sans-serif;
                  "
                >
                  If you did not create a vBiz Me account, you can safely ignore this email.
                </p>
              </td>
            </tr>
            <tr>
              <td
                align="center"
                style="background-color: #fafaf9; border-top: 1px solid #e7e5e4; padding: 20px 32px"
                class="mobile-padding"
              >
                <p
                  style="
                    margin: 0 0 8px;
                    color: #a3a3a3;
                    font-size: 12px;
                    line-height: 1.5;
                    font-family: Inter, Helvetica, Arial, sans-serif;
                  "
                >
                  © {{year}} vBiz Me. All rights reserved.
                </p>
                <p
                  style="
                    margin: 0;
                    color: #a3a3a3;
                    font-size: 12px;
                    line-height: 1.5;
                    font-family: Inter, Helvetica, Arial, sans-serif;
                  "
                >
                  <a href="https://www.vbizme.com/privacy-policy" style="color: #737373; text-decoration: underline"
                    >Privacy</a
                  >
                  &nbsp;·&nbsp;
                  <a
                    href="https://www.vbizme.com/terms-and-conditions"
                    style="color: #737373; text-decoration: underline"
                    >Terms</a
                  >
                  &nbsp;·&nbsp;
                  <a href="https://www.vbizme.com/" style="color: #737373; text-decoration: underline">vbizme.com</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
