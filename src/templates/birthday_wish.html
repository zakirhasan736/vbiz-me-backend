<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday — VBizMe</title>
    <style type="text/css">
      body {
        margin: 0;
        padding: 0;
        width: 100% !important;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f4f6f8;
      }
      table {
        border-collapse: collapse !important;
      }
      a[x-apple-data-detectors] {
        color: inherit !important;
        text-decoration: none !important;
      }
      @media screen and (max-width: 600px) {
        .wrapper {
          width: 100% !important;
        }
        .mobile-padding {
          padding-left: 16px !important;
          padding-right: 16px !important;
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f6f8">
    <table border="0" cellpadding="0" cellspacing="0" width="100%">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="600"
            class="wrapper"
            style="max-width: 600px; background-color: #ffffff; border-radius: 12px; overflow: hidden"
          >
            <tr>
              <td
                align="center"
                style="background: linear-gradient(135deg, #0f766e 0%, #115e59 100%); padding: 36px 24px"
                class="mobile-padding"
              >
                <p
                  style="
                    margin: 0 0 8px;
                    color: #ccfbf1;
                    font-size: 13px;
                    letter-spacing: 2px;
                    text-transform: uppercase;
                  "
                >
                  VBizMe
                </p>
                <p style="margin: 0; color: #ffffff; font-size: 28px; font-weight: 700">Happy Birthday!</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 36px 28px 12px" class="mobile-padding">
                <p style="margin: 0 0 8px; color: #111827; font-size: 18px; font-weight: 700">Hi {{owner_name}},</p>
                <p style="margin: 0; color: #4b5563; font-size: 16px; line-height: 1.6">
                  Today is a special day for
                  <strong style="color: #0f766e">{{card_name}}</strong>. Wishing them a wonderful birthday filled with
                  joy and success.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 20px 28px 8px" class="mobile-padding">
                <table
                  border="0"
                  cellpadding="0"
                  cellspacing="0"
                  width="100%"
                  style="background-color: #f0fdfa; border-radius: 10px; border: 1px solid #99f6e4"
                >
                  <tr>
                    <td align="center" style="padding: 24px 20px">
                      <p
                        style="
                          margin: 0 0 6px;
                          color: #0f766e;
                          font-size: 12px;
                          font-weight: 700;
                          letter-spacing: 1px;
                          text-transform: uppercase;
                        "
                      >
                        Birthday card
                      </p>
                      <p style="margin: 0 0 4px; color: #134e4a; font-size: 22px; font-weight: 700">{{card_name}}</p>
                      <p style="margin: 0; color: #5eead4; font-size: 14px">{{wish_date}}</p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 28px 28px 36px" class="mobile-padding">
                <a
                  href="{{card_url}}"
                  style="
                    display: inline-block;
                    background-color: #0f766e;
                    color: #ffffff;
                    font-size: 15px;
                    font-weight: 700;
                    text-decoration: none;
                    padding: 14px 28px;
                    border-radius: 8px;
                  "
                  >View their card</a
                >
                <p style="margin: 20px 0 0; color: #9ca3af; font-size: 13px; line-height: 1.5">
                  You’re receiving this because you own this digital business card on VBizMe.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
